<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="__META_DESCRIPTION__" />
    <meta name="keywords" content="__META_KEYWORDS__" />
    <meta name="author" content="__SITE_NAME__" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#064e3b" />
    <link rel="canonical" href="__CANONICAL_URL__" />

    <!-- Schema.org itemprops for WhatsApp / Telegram -->
    <meta itemprop="name" content="__OG_TITLE__" />
    <meta itemprop="description" content="__OG_DESCRIPTION__" />
    <meta itemprop="image" content="__OG_IMAGE_URL__" />
    
    <!-- Open Graph harus tersedia langsung di HTML awal agar crawler WhatsApp/Facebook bisa membaca tanpa menjalankan JavaScript -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="__SITE_NAME__" />
    <meta property="og:title" content="__OG_TITLE__" />
    <meta property="og:description" content="__OG_DESCRIPTION__" />
    <meta property="og:url" content="__CANONICAL_URL__" />
    <meta property="og:image" content="__OG_IMAGE_URL__" />
    <meta property="og:image:url" content="__OG_IMAGE_URL__" />
    <meta property="og:image:secure_url" content="__OG_IMAGE_URL__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="__OG_IMAGE_TYPE__" />
    <meta property="og:image:alt" content="__IMAGE_ALT__" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__TWITTER_TITLE__" />
    <meta name="twitter:description" content="__TWITTER_DESCRIPTION__" />
    <meta name="twitter:image" content="__OG_IMAGE_URL__" />
    <meta name="twitter:image:alt" content="__IMAGE_ALT__" />
    <meta name="twitter:url" content="__CANONICAL_URL__" />
    <link rel="image_src" href="__OG_IMAGE_URL__" />

    <!-- JSON-LD Structured Data for Google Search Engine -->
    <script type="application/ld+json">
      __JSON_LD_DATA__
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cinzel:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <title>__META_TITLE__</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
